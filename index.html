<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="theme-color" content="#00194A">
    <title>Tiangmaatla chats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --sa-green: #007749;
            --sa-blue: #00194A;
            --sa-yellow: #FFB612;
            --sa-red: #E03C31;
            --chat-bg: #f0f2f5;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--chat-bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
            opacity: 0.20;
            pointer-events: none;
            z-index: 0;
        }

        .header-bar {
            height: 4px;
            background: linear-gradient(90deg, var(--sa-green) 25%, var(--sa-yellow) 25%, var(--sa-yellow) 50%, var(--sa-red) 50%, var(--sa-red) 75%, var(--sa-blue) 75%);
        }

        .navbar {
            background: var(--sa-blue);
            padding: 10px 12px;
            position: fixed;
            top: 4px;
            left: 0;
            right: 0;
            z-index: 1030;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 600;
            font-size: 1rem;
        }

        .navbar-brand i {
            color: var(--sa-yellow);
        }

        .user-badge {
            background: rgba(255,255,255,0.12);
            border-radius: 40px;
            padding: 5px 12px;
            color: white;
            font-size: 0.7rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 48vw;
        }

        .online-stats {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 4px 14px;
            font-size: 0.7rem;
            font-weight: 500;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
            white-space: nowrap;
        }
        .online-stats i {
            color: #2ecc71;
            font-size: 0.7rem;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8);}
            100% { opacity: 1; transform: scale(1);}
        }

        .chat-main {
            flex: 1;
            overflow-y: auto;
            padding: 95px 10px 80px 10px;
            position: relative;
        }

        .chat-main::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }

        .chat-container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .dept-selector {
            position: fixed;
            top: 70px;  
            right: 12px;
            z-index: 1040;  
            background: white;
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .dept-selector i { color: var(--sa-green); font-size: 0.8rem; }
        .dept-selector select {
            border: none;
            background: white;
            font-weight: 600;
            color: var(--sa-blue);
            outline: none;
            font-size: 0.75rem;
            padding: 6px 8px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 40px;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23007749' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
            padding-right: 28px;
        }

        .specific-dept-selector {
            position: fixed;
            top: 118px; 
            right: 12px;
            z-index: 1040;
            background: white;
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 6px 16px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .specific-dept-selector.active { display: flex; }
        .specific-dept-selector i { color: var(--sa-green); }
        .specific-dept-selector select {
            border: none;
            background: white;
            font-weight: 500;
            color: var(--sa-blue);
            outline: none;
            font-size: 0.75rem;
            padding: 6px 8px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 40px;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23007749' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
            padding-right: 28px;
        }

        .vote-mode-indicator {
            position: fixed;
            bottom: 85px;
            right: 12px;
            background: var(--sa-green);
            color: white;
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            display: none;
            z-index: 1026;
            font-weight: 500;
            pointer-events: none;
        }
        .vote-mode-indicator.active { display: block; }

        .message {
            display: flex;
            margin-bottom: 14px;
            animation: fadeIn 0.2s ease;
        }

        .message.outgoing { justify-content: flex-end; }
        .message.incoming { justify-content: flex-start; }

        .bubble {
            margin-top: 20px;
            max-width: 82%;
            background: white;
            border-radius: 22px;
            padding: 8px 14px;
        }

        .outgoing .bubble { background: #dcf8c5; border-bottom-right-radius: 6px; }
        .incoming .bubble { background: white; border-bottom-left-radius: 6px; }

        .author {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--sa-green);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .dept-tag {
            font-size: 0.6rem;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 30px;
            font-weight: 400;
        }

        .tiangmaatla-tag {
            background: var(--sa-yellow);
            color: #000;
        }

        .message-text {
            padding: 8px 0 10px 0;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message-img {
            max-width: 100%;
            border-radius: 16px;
            margin-top: 6px;
            cursor: pointer;
            max-height: 180px;
        }

        .time {
            font-size: 0.6rem;
            color: #6c757d;
            text-align: right;
            margin-top: 4px;
        }

        .avatar {
            margin-top: 20px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sa-green));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .vote-box {
            background: #eef3fc;
            border-radius: 20px;
            padding: 10px;
            margin-top: 8px;
        }

        .vote-option {
            background: white;
            border-radius: 40px;
            padding: 8px 14px;
            margin: 6px 0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #dee2e6;
            font-size: 0.85rem;
        }

        .vote-count { font-weight: 700; color: var(--sa-green); }

        .input-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(4px);
            padding: 10px 12px;
            border-top: 0.5px solid rgba(0,0,0,0.06);
            z-index: 1020;
        }

        .input-primary {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            width: 100%;
        }

        .input-field {
            flex: 1;
            border: 1px solid #e2e8f0;
            border-radius: 28px;
            padding: 10px 16px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            max-height: 100px;
            background: #ffffff;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--sa-green);
        }

        .send-btn {
            background: var(--sa-green);
            color: white;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            transition: 0.1s;
        }
        .send-btn:active { transform: scale(0.94); }

        .expand-toggle {
            background: #f0f2f5;
            border: none;
            border-radius: 40px;
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--sa-green);
            cursor: pointer;
            flex-shrink: 0;
        }

        .action-drawer {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.28s cubic-bezier(0.2, 0.9, 0.4, 1.1), opacity 0.2s;
            margin-top: 0px;
            visibility: hidden;
        }
        .action-drawer.open {
            max-height: 160px;
            opacity: 1;
            margin-top: 12px;
            visibility: visible;
        }

        .icon-strip {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 16px;
            background: #ffffffdd;
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 60px;
        }

        .action-icon {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            color: #2c3e50;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.1s;
        }
        .action-icon:active { background: rgba(0,0,0,0.05); transform: scale(0.95); }

        .image-panel {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            background: white;
            padding: 10px 14px;
            border-radius: 48px;
            align-items: center;
            width: 100%;
        }
        .image-panel input { flex: 1; font-size: 0.85rem; padding: 8px 12px; }

        .join-panel {
            background: white;
            border-radius: 32px;
            padding: 32px 24px;
            max-width: 380px;
            margin: 20px auto;
            text-align: center;
        }
        .code-input {
            font-size: 1.8rem;
            letter-spacing: 6px;
            text-align: center;
            font-weight: 700;
            font-family: monospace;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px);}
            to { opacity: 1; transform: translateY(0);}
        }

        #emojiPicker {
            position: fixed;
            bottom: 90px;
            left: 12px;
            background: white;
            border-radius: 24px;
            display: none;
            width: 280px;
            max-height: 300px;
            overflow-y: auto;
            padding: 12px;
            z-index: 1100;
        }
        #votePopup { z-index: 1101; }

        @media (max-width: 600px) {
            .dept-selector, .specific-dept-selector {
                padding: 4px 12px;
            }
            .dept-selector select, .specific-dept-selector select {
                font-size: 0.7rem;
                padding: 4px 6px;
                padding-right: 24px;
            }
            .chat-main {
                padding: 100px 8px 80px 8px;
            }
        }

        .reaction-container{
    margin-top:8px;
}

.reaction-buttons{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:4px;
}

.reaction-btn {
    border: none;
    background: #f5f7fa;
    border-radius: 20px;
    padding: 4px 8px;
    font-size: 16px;
    min-width: 36px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s ease;
}

.reaction-btn:hover {
    background: #e9ecef;
    transform: scale(1.05);
}

.reaction-counts{
    margin-top:6px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.reaction-pill{
    background:#eef3fc;
    border-radius:20px;
    padding:3px 8px;
    font-size:0.75rem;
    font-weight:600;
}

.typing-box{
    padding:8px 14px;
    color:#666;
    font-size:0.8rem;
    font-style:italic;
}

.dots span{
    animation: blink 1.4s infinite;
}

.dots span:nth-child(2){
    animation-delay:.2s;
}

.dots span:nth-child(3){
    animation-delay:.4s;
}

@keyframes blink{
    0%,100%{opacity:0.2;}
    50%{opacity:1;}
}

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg, #007749, #00a86b);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    flex-shrink: 0;
    font-size: 0.9rem;
    border: 2px solid white;
}

.profile-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:1.2rem;
    cursor:pointer;
}

.profile-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:3000;
}

.profile-modal.active{
    display:flex;
}

.profile-modal-content{
    background:white;
    width:90%;
    max-width:360px;
    border-radius:24px;
    padding:24px;
    position:relative;
    animation:fadeIn .2s ease;
}

.close-profile-btn{
    position:absolute;
    top:12px;
    right:12px;
    border:none;
    background:#f0f2f5;
    width:34px;
    height:34px;
    border-radius:50%;
    cursor:pointer;
}

.attachment-panel {
    display: none;
    position: absolute;
    bottom: 70px;
    left: 10px;
    right: 10px;
    background: white;
    padding: 12px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    z-index: 999;
}

.action-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #f5f7fa;
    color: #007749;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.25s ease;

}

.action-btn:hover {
    background: #007749;
    color: white;
    transform: scale(1.06);
}

.action-btn:active {
    transform: scale(0.96);
}

@media (max-width: 767px) {
    #deptSelector {
        top: 10px !important;
    }
}

.voice-panel{
    display:none;
    position:fixed;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    width:92%;
    max-width:360px;
    background:white;
    border-radius:24px;
    padding:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.18);
    z-index:9999;
}

.voice-header{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    margin-bottom:16px;
}

.recording-status{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
    font-size:1.1rem;
    font-weight:600;
}

.record-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:red;
    animation:pulseRecord 1s infinite;
}

@keyframes pulseRecord{
    0%{opacity:0.3;}
    50%{opacity:1;}
    100%{opacity:0.3;}
}

.voice-actions{
    display:flex;
    justify-content:center;
    gap:18px;
}

.voice-action-btn{
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;

    font-size:1.2rem;
}

.start-btn{
    background:#25d366;
}

.stop-btn{
    background:#e53935;
}

.profile-btn{
    position:relative;

}

.profile-notification-badge{
    position:absolute;
    top:-4px;
    right:-2px;
    min-width:20px;
    height:20px;
    padding:0 6px;
    border-radius:20px;
    background:#ff3b30;
    color:white;
    font-size:0.7rem;
    font-weight:700;
    display:none;
    align-items:center;
    justify-content:center;
    border:2px solid #00194A;
    z-index:20;
    animation:notificationPulse 1.2s infinite;
}

@keyframes notificationPulse{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
    100%{
        transform:scale(1);
    }
}

.file-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;

    padding: 6px 10px;
    margin-top: 6px;

    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    border-radius: 12px;

    color: #0d6efd;
    text-decoration: none !important;

    font-size: 0.85rem;
    font-weight: 500;

    max-width: 100%;
    word-break: break-word;
}

.file-link:hover {
    background: #eaf2ff;
    border-color: #cfe2ff;
    transform: scale(1.01);
}

<body>
<div class="header-bar"></div>
<nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center px-2">
        <a class="navbar-brand" href="#" onclick="goFullScreen()">
            <i class="fas fa-comments me-1"></i>
            <span id="appTitle">App mode</span>
        </a>    
        <div class="d-flex align-items-center gap-2">
            <div id="onlineUsersBadge" class="online-stats"><i class="fas fa-circle"></i> <span id="onlineCount">0</span> online</div>
            <div id="userInfo" class="user-badge"><i class="fas fa-id-card me-1"></i><span id="userName">Not logged in</span></div>
            <button id="profileBtn" class="profile-btn">

                <div class="profile-notification-badge" id="profileNotificationBadge">
                    0
                </div>

                <img
                    id="profileBtnImage"
                    src=""
                    style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:none;"
                >

                <i id="profileBtnIcon" class="fas fa-user-circle"></i>

            </button>
        </div>
    </div>
</nav>

<div id="deptSelector" class="dept-selector" style="display: none;">
    <i class="fas fa-paper-plane"></i>
    <select id="recipientSelect">
        <option value="all">All Dept</option>
        <option value="my">My Dept</option>
        <option value="specific">Specific Dept</option>
    </select>
</div>
<div id="specificDeptSelector" class="specific-dept-selector">
    <i class="fas fa-building"></i>
    <select id="targetDeptSelect"><option value="">Select department...</option></select>
</div>
<div id="voteIndicator" class="vote-mode-indicator"><i class="fas fa-chart-simple me-1"></i> Poll mode</div>

<div class="chat-main" id="chatMain">
    <div class="chat-container">
        <div id="loginPanel">
            <div class="join-panel">
                <i class="fas fa-key fa-2x mb-2" style="color: var(--sa-green);"></i>
                <h5>Access code</h5>
                <p class="text-muted small">4-digit code</p>
                <input type="text" id="accessCode" class="form-control code-input mb-3" maxlength="4" placeholder="0000" autocomplete="off" inputmode="numeric">
                <button id="loginBtn" class="btn w-100 py-2" style="background: var(--sa-green); color: white; border-radius: 40px;">Enter Chat</button>
                <hr class="my-3">
                <small class="text-muted">secure team access</small>
            </div>
        </div>

        <div id="chatArea" style="display: none;">
            <div class="mb-2">
                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search messages by department..."
                >
            </div>
            <div id="messagesList"></div>
            <div id="typingIndicator" class="typing-box" style="display:none;">
            <span id="typingText">Someone is typing</span>
            <span class="dots">
                <span>.</span><span>.</span><span>.</span>
            </span>
            </div>
        </div>
    </div>
</div>

<div class="input-bar" id="inputBar" style="display: none;">
    <div id="replyPreview" style="display:none;background:#f1f3f5;padding:8px;border-radius:8px;margin-bottom:8px;">
   <div id="replyText"></div>

   <button onclick="cancelReply()" style="border:none;background:none;color:red;font-size:12px;">
      Cancel
   </button>
</div>

    const now = new Date();
    const hour = now.getHours();
    const day = now.getDay();

    // weekend off
    if (day === 0 || day === 6) return null;

    // Friday special
    if (day === 5) {
        return zackMessages.friday[
            Math.floor(Math.random() * zackMessages.friday.length)
        ];
    }

    let pool;

    if (hour < 10) pool = zackMessages.morning;
    else if (hour < 12) pool = zackMessages.midmorning;
    else if (hour < 15) pool = zackMessages.afternoon;
    else pool = zackMessages.closing;

    return pool[Math.floor(Math.random() * pool.length)];
}

    async function deleteOldMessages() {

    // Get old messages first
    const { data: oldMessages, error: fetchError } = await db
        .from('messages')
        .select('*')
        .lt('created_at', expiryDate.toISOString());

    if (fetchError) {
        console.warn("Fetch old messages error:", fetchError);
        return;
    }

    if (!oldMessages || oldMessages.length === 0) {
        return;
    }

    // Delete uploaded files from storage
    for (const msg of oldMessages) {

        // Delete attached file/image
        if (msg.content && msg.content.includes('supabase')) {

            try {

                const fileName =
                    msg.content.split('/').pop().split('?')[0];

                if (fileName) {
                    await db.storage
                        .from('chat-files')
                        .remove([fileName]);
                }

            } catch (err) {
                console.warn("File delete error:", err);
            }
        }

        // Delete image_url uploads
        if (msg.image_url) {

            try {

                const fileName =
                    msg.image_url.split('/').pop().split('?')[0];

                if (fileName) {
                    await db.storage
                        .from('chat-files')

        .from('messages')

        .lt('created_at', expiryDate.toISOString());

    }

    );
}

        for (let msg of filtered) {

}

if (lastMessageCount > 0 && filtered.length > lastMessageCount) {

}

lastMessageCount = filtered.length;

    function renderMessages(messages) {
        let container = document.getElementById('messagesList');
        if (!messages.length) { container.innerHTML = '<div class="text-center text-muted py-5"><i class="fas fa-comments fa-2x mb-2"></i><p>No messages yet</p></div>'; return; }
        let html = '';
        for (let msg of messages) {
            let isMine = msg.author_name === currentUser.full_name;
            let messageDate = new Date(msg.created_at);
        let today = new Date();
        let yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);

        let dateString = '';
        if (messageDate.toDateString() === today.toDateString()) {
            dateString = 'Today';
        } else if (messageDate.toDateString() === yesterday.toDateString()) {
            dateString = 'Yesterday';
        } else {
            dateString = messageDate.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }
        let timeString = messageDate.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
        let date = `${dateString} at ${timeString}`;
            let deletedTime = msg.deleted_at
            ? new Date(msg.deleted_at).toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            })
            : '';
            let initial = msg.author_name.charAt(0).toUpperCase();

            let tiangBadge = msg.is_tiangmaatla ? '<span class="dept-tag tiangmaatla-tag"> Tiang</span>' : '';
            let contentHtml = '';

            if (
                (msg.content || '').includes('.webm') ||
                    (msg.content || '').includes('audio')
                ) {
                contentHtml = `
                    <audio controls style="width:100%;margin-top:6px;">
                        <source src="${escapeHtml(msg.content)}" type="audio/webm">
                    </audio>
                `;
            } else {
                contentHtml = `<div class="message-text">${formatMessageContent(msg.content)}</div>`;
            }
            function formatMessageContent(text) {
                if (!text) return '';

                let safe = escapeHtml(text);

                safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                safe = safe.replace(/_(.*?)_/g, '<em>$1</em>');

                safe = safe.replace(/~(.*?)~/g, '<del>$1</del>');

                const urlRegex = /(https?:\/\/[^\s]+)/g;
                safe = safe.replace(urlRegex, (url) => {

    const lowerUrl = url.toLowerCase();

    const isImage =
        lowerUrl.includes('.png') ||
        lowerUrl.includes('.jpg') ||
        lowerUrl.includes('.jpeg') ||
        lowerUrl.includes('.gif') ||
        lowerUrl.includes('.webp');

    if (isImage) {

        return `
            <img
                src="${url}"
                class="message-img"
                onclick="openImage('${url}')"
            >
        `;
    }

    const fileName = url.split('/').pop().split('?')[0];

    return `
        <a
            href="${url}"
            target="_blank"
            class="file-link"
        >
            ${fileName.trim()}
        </a>
    `;
});

                return safe;
            }

            let replyHtml = '';

            if (msg.reply_to) {
                replyHtml = `
                    <div style="background:#f8f9fa;padding:6px;border-radius:6px;font-size:12px;margin-bottom:6px;">
                        <strong>${escapeHtml(msg.reply_author)}</strong><br>
                        ${formatMessageContent(msg.reply_content)}
                    </div>

            }
            if (msg.is_vote && msg.vote_option_a && msg.vote_option_b) {
                contentHtml = `<div class="vote-box">
                    <div class="vote-option" onclick="castVote('${msg.id}', 'A')"><span><strong>A:</strong> ${escapeHtml(msg.vote_option_a)}</span><span class="vote-count">👍 ${msg.vote_a_count || 0}</span></div>
                    <div class="vote-option" onclick="castVote('${msg.id}', 'B')"><span><strong>B:</strong> ${escapeHtml(msg.vote_option_b)}</span><span class="vote-count">👍 ${msg.vote_b_count || 0}</span></div>
                    ${(msg.users_voted || []).includes(currentUser.access_code) ? '<small class="text-muted">✓ Voted</small>' : '<small class="text-muted">Tap to vote</small>'}</div>`;
            }
            html += `<div class="message ${isMine ? 'outgoing' : 'incoming'}"><div class="d-flex gap-2" style="max-width:88%;">${!isMine ? `<div class="avatar"> ${ msg.profile_image ? `<img src="${escapeHtml(msg.profile_image)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : initial } </div>` : ''}<div class="bubble" onclick="toggleReactions('${msg.id}')" style="cursor:pointer;"><div class="author">${escapeHtml(msg.author_name)} <span class="dept-tag">${escapeHtml(msg.author_dept)}</span> ${tiangBadge} <span class="text-muted small">${recipientIcon}</span></div>${replyHtml}
${contentHtml}${renderReactionSection(msg)}<div class="d-flex justify-content-between align-items-center mt-1">
   <div class="time">
   ${date}
${isMine ? `<small style="color:#007749;">
Seen by ${msg.seen_by ? msg.seen_by.length : 0}
</small>` : ''}
   ${msg.is_deleted && !isMine
    ? `<small style="color:red;">Deleted</small>`
    : ''}
   ${msg.is_edited ? `<small style="color:orange;">Edited</small>` : ''}
</div>
   <div style="display:flex;gap:8px;align-items:center;">

   ${
      isMine
      ? (() => {
            let messageAge = (new Date() - new Date(msg.created_at)) / 1000 / 60;
            if (messageAge <= 6 && !msg.is_deleted) {
                return `
                    <button onclick="editMessage('${msg.id}', '${escapeHtml(msg.content)}')"
                        style="border:none;background:none;color:orange;font-size:12px;">

</div>

</div></div>${isMine ? `<div class="avatar"> ${ msg.profile_image ? `<img src="${escapeHtml(msg.profile_image)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : initial } </div>` : ''}</div></div>`;
        }
        container.innerHTML = html;

}

window.deleteMessage = async function(messageId) {
    let { data: msg } = await db.from('messages').select('created_at').eq('id', messageId).single();
    if (!msg) return;
    
    let messageAge = (new Date() - new Date(msg.created_at)) / 1000 / 60;
    if (messageAge > 6) {
        showToast("Cannot delete messages older than 6 minutes", true);
        return;
    }
    
    if (!confirm("Delete this message?")) return;

    const { error } = await db
        .from('messages')
        .update({
            content: "🚫 This message was deleted",
            image_url: null,
            is_deleted: true,
            deleted_at: new Date().toISOString()
        })
        .eq('id', messageId);

    if (error) {
        showToast("Failed to delete", true);
        return;
    }

    showToast("Message deleted");
    loadMessages();
};

window.editMessage = async function(messageId, oldText) {
    const newText = prompt("Edit message:", oldText);

    if (!newText) return;
    if (newText.trim() === oldText.trim()) return;

    const { error } = await db
        .from('messages')
        .update({
            content: newText.trim(),
            is_edited: true,
            edited_at: new Date().toISOString()
        })
        .eq('id', messageId);

    if (error) {
        showToast("Edit failed", true);
        return;
    }

    showToast("Message updated");
    loadMessages();
};

let mediaRecorder;
let recordingInterval = null;
let recordingSeconds = 0;
let audioChunks = [];
let recordedAudioBlob = null;

document.getElementById('voiceBtn').onclick = () => {
    const panel = document.getElementById('voicePanel');
    panel.style.display =
        panel.style.display === 'block' ? 'none' : 'block';

document.getElementById('startRecordBtn').onclick = async () => {

    recordingSeconds = 0;

    const recordingTime = document.getElementById('recordingTime');

    recordingInterval = setInterval(() => {

        recordingSeconds++;

        const mins = String(Math.floor(recordingSeconds / 60)).padStart(2,'0');
        const secs = String(recordingSeconds % 60).padStart(2,'0');

        recordingTime.textContent = `${mins}:${secs}`;

    }, 1000);

    const stream = await navigator.mediaDevices.getUserMedia({
        audio: true
    });

    mediaRecorder = new MediaRecorder(stream);

    audioChunks = [];

    mediaRecorder.ondataavailable = e => {
        audioChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {

        clearInterval(recordingInterval);

        recordedAudioBlob = new Blob(audioChunks, {
            type: 'audio/webm'
        });

        const audioUrl = URL.createObjectURL(recordedAudioBlob);

        document.getElementById('audioPreview').src = audioUrl;
        document.getElementById('audioPreview').style.display = 'block';

        document.getElementById('sendVoiceBtn').style.display = 'block';
    };

    mediaRecorder.start();

    showToast("Recording started");
};

document.getElementById('stopRecordBtn').onclick = () => {

    if (mediaRecorder) {

        mediaRecorder.stop();

        clearInterval(recordingInterval);

        showToast("Recording stopped");
    }
};

document.getElementById('sendVoiceBtn').onclick = async () => {

    if (!recordedAudioBlob) return;

    showToast("Uploading voice note...");

    try {

        const fileName =
            "voice_" +
            Date.now() +
            "_" +
            currentUser.access_code +
            ".webm";

        // Upload voice note to Supabase Storage
        const { error: uploadError } = await db.storage
            .from('chat-files')
            .upload(fileName, recordedAudioBlob, {
                contentType: 'audio/webm'
            });

        if (uploadError) {

            console.error(uploadError);

            showToast("Voice upload failed", true);

            return;
        }

        // Get public URL
        const { data } = db.storage
            .from('chat-files')
            .getPublicUrl(fileName);

        const audioUrl = data.publicUrl;

        // Send URL as normal message
        await sendMessage(audioUrl, null, false);

        // Reset UI
        document.getElementById('voicePanel').style.display = 'none';

        document.getElementById('audioPreview').style.display = 'none';

        document.getElementById('audioPreview').src = '';

        document.getElementById('sendVoiceBtn').style.display = 'none';

        recordedAudioBlob = null;

        showToast("Voice note sent");

    } catch (err) {

        console.error(err);

        showToast("Voice upload failed", true);
    }
};

document.getElementById('realFileInput').addEventListener('change', async function () {

    const file = this.files[0];

    if (!file) return;

    const MAX_IMAGE_SIZE = 5 * 1024 * 1024;
    const MAX_FILE_SIZE = 10 * 1024 * 1024;

    const isImage = file.type.startsWith('image/');

    if (isImage && file.size > MAX_IMAGE_SIZE) {
        showToast("Image too large (max 5MB)", true);
        return;
    }

    if (!isImage && file.size > MAX_FILE_SIZE) {
        showToast("File too large (max 10MB)", true);
        return;
    }

    if (file.name.includes('<') || file.name.includes('>')) {
    showToast("Invalid file name", true);
    return;
}

    showToast("Uploading file...");

    const cleanName = file.name
    .replace(/[^a-zA-Z0-9.\-_]/g, '_')  // safe only
    .replace(/_+/g, '_');              // remove double underscores 

    const fileName = Date.now() + "_" + cleanName;

    const { error } = await db.storage
        .from('chat-files')
        .upload(fileName, file);

    if (error) {
        showToast("Upload failed", true);
        console.error(error);
        return;
    }

    const { data } = db.storage
        .from('chat-files')
        .getPublicUrl(fileName);

    await sendMessage(data.publicUrl, null, false);

    showToast("File uploaded");
});
